[project]
name = "whisperwing"
version = "0.1.0"
description = ""
authors = [
    {name = "Artem Folinger",email = "folingerzlive@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyaudiowpatch (>=0.2.12.8,<0.3.0.0)",
    "faster-whisper (>=1.2.1,<2.0.0)",
    "numpy (<2.1)",
    "anthropic (>=0.122.0,<0.123.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "keyboard (>=0.13.5,<0.14.0)",
    "requests (>=2.34.2,<3.0.0)",
    "webrtcvad-wheels (>=2.0.14,<3.0.0)",
    "mss (>=10.2.0,<11.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pyqt6 (>=6.11.0,<7.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "silero-vad (>=6.2.1,<7.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
whisperwing = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.6,<0.17.0)"
]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]