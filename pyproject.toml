[project]
name = "whisperwing"
version = "0.1.0"
description = ""
authors = [
    {name = "Artem Folinger",email = "folingerzlive@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyaudiowpatch (>=0.2.12.8,<0.3.0.0)",
    "faster-whisper (>=1.2.1,<2.0.0)",
    "numpy (<2.1)",
    "anthropic (>=0.122.0,<0.123.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "keyboard (>=0.13.5,<0.14.0)",
    "requests (>=2.34.2,<3.0.0)",
    "webrtcvad-wheels (>=2.0.14,<3.0.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
whisperwing = "src.main:main"
